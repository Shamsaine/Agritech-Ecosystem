services:
  postgres:
    image: postgres:17
    container_name: agritech-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agritech
      POSTGRES_USER: agritech_user
      POSTGRES_PASSWORD: agritech_password

    ports:
      - "5434:5432"

    volumes:
      - agritech_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agritech_user -d agritech"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agritech_postgres_data: